<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vencimento de Produtos (Simulação)</title>
    <!-- Inclui o Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .container-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .status-ok { color: #16a34a; }
        .status-a-vencer { color: #eab308; }
        .status-vencido { color: #ef4444; }
        /* Estilos para a tabela */
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f9fafb;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="p-8">

    <!-- Container principal -->
    <div class="max-w-7xl mx-auto container-wrapper">

        <!-- Título e Descrição -->
        <header class="text-center">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">Dashboard de Controle de Vencimento</h1>
            <p class="text-lg text-gray-600">Simulação de uma planilha Excel com automações para controle de estoque.</p>
        </header>

        <!-- Seção de Entrada de Dados (Simulação) -->
        <div class="card">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Adicionar Novo Produto</h2>
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="text" id="productName" placeholder="Nome do Produto" class="p-3 border rounded-md" required>
                <select id="productType" class="p-3 border rounded-md" required>
                    <option value="">Tipo de Produto</option>
                    <option value="Produto Acabado">Produto Acabado</option>
                    <option value="Matéria-Prima">Matéria-Prima</option>
                </select>
                <input type="date" id="expirationDate" class="p-3 border rounded-md" required>
                <input type="number" id="quantity" placeholder="Quantidade" class="p-3 border rounded-md" required min="1">
                <button type="submit" class="bg-blue-600 text-white p-3 rounded-md font-bold hover:bg-blue-700 transition-colors col-span-1 md:col-span-2 lg:col-span-4">Adicionar Produto</button>
            </form>
        </div>

        <!-- Seção da Planilha de Dados -->
        <div class="card overflow-x-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-800">Planilha de Dados Brutos</h2>
                <button id="updateDashboardBtn" class="bg-green-600 text-white p-2 rounded-md font-bold hover:bg-green-700 transition-colors">Atualizar Dashboard</button>
            </div>
            <table class="min-w-full divide-y divide-gray-200">
                <thead>
                    <tr>
                        <th class="py-3 px-6 text-xs text-gray-500 uppercase tracking-wider">Produto</th>
                        <th class="py-3 px-6 text-xs text-gray-500 uppercase tracking-wider">Tipo</th>
                        <th class="py-3 px-6 text-xs text-gray-500 uppercase tracking-wider">Data de Vencimento</th>
                        <th class="py-3 px-6 text-xs text-gray-500 uppercase tracking-wider">Quantidade</th>
                        <th class="py-3 px-6 text-xs text-gray-500 uppercase tracking-wider">Dias para Vencer</th>
                        <th class="py-3 px-6 text-xs text-gray-500 uppercase tracking-wider">Status de Vencimento</th>
                    </tr>
                </thead>
                <tbody id="productTableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Linhas da tabela serão inseridas aqui via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Seção do Dashboard de Resumo -->
        <div class="card">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Dashboard de Resumo</h2>
            <div id="dashboardSummary" class="grid-dashboard">
                <!-- Cards de resumo serão inseridos aqui via JavaScript -->
            </div>
        </div>

    </div>

    <script>
        // Array para armazenar os dados dos produtos, simulando as linhas da planilha
        let products = [
            { id: 1, productName: "Maionese", productType: "Produto Acabado", expirationDate: "2025-10-10", quantity: 1500 },
            { id: 2, productName: "Farinha de Trigo", productType: "Matéria-Prima", expirationDate: "2024-09-15", quantity: 500 },
            { id: 3, productName: "Ketchup", productType: "Produto Acabado", expirationDate: "2024-08-25", quantity: 3200 },
            { id: 4, productName: "Tomate", productType: "Matéria-Prima", expirationDate: "2024-07-20", quantity: 200 }, // Produto vencido
            { id: 5, productName: "Mostarda", productType: "Produto Acabado", expirationDate: "2024-10-20", quantity: 1800 }, // Produto A Vencer (3 meses)
            { id: 6, productName: "Cebola", productType: "Matéria-Prima", expirationDate: "2024-09-05", quantity: 700 } // Matéria-Prima A Vencer (1 mês)
        ];

        let nextId = products.length + 1;

        // Função principal para calcular os status e renderizar a tabela
        function updateDashboard() {
            renderTable();
            renderSummary();
        }

        // Função para calcular os dias e o status de vencimento
        function calculateStatus(product) {
            const today = new Date();
            const expDate = new Date(product.expirationDate);
            const diffTime = expDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            product.diasParaVencer = diffDays;

            if (diffDays <= 0) {
                product.status = "VENCIDO";
                product.statusClass = "status-vencido";
            } else if (product.productType === "Produto Acabado" && diffDays <= 90) {
                product.status = "A VENCER (3 MESES)";
                product.statusClass = "status-a-vencer";
            } else if (product.productType === "Matéria-Prima" && diffDays <= 30) {
                product.status = "A VENCER (1 MÊS)";
                product.statusClass = "status-a-vencer";
            } else {
                product.status = "OK";
                product.statusClass = "status-ok";
            }
            return product;
        }

        // Função para renderizar as linhas da tabela
        function renderTable() {
            const tableBody = document.getElementById('productTableBody');
            tableBody.innerHTML = ''; // Limpa a tabela para renderizar novamente
            
            products.forEach(p => {
                const updatedProduct = calculateStatus(p);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="whitespace-nowrap px-6 py-4">${updatedProduct.productName}</td>
                    <td class="whitespace-nowrap px-6 py-4">${updatedProduct.productType}</td>
                    <td class="whitespace-nowrap px-6 py-4">${updatedProduct.expirationDate}</td>
                    <td class="whitespace-nowrap px-6 py-4">${updatedProduct.quantity}</td>
                    <td class="whitespace-nowrap px-6 py-4">${updatedProduct.diasParaVencer}</td>
                    <td class="whitespace-nowrap px-6 py-4 font-bold ${updatedProduct.statusClass}">${updatedProduct.status}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Função para renderizar o dashboard de resumo
        function renderSummary() {
            const dashboardSummary = document.getElementById('dashboardSummary');
            dashboardSummary.innerHTML = ''; // Limpa o resumo para renderizar novamente

            const summary = {
                'OK': 0,
                'A VENCER': 0,
                'VENCIDO': 0
            };

            products.forEach(p => {
                calculateStatus(p);
                if (p.status.includes('VENCER')) {
                    summary['A VENCER']++;
                } else if (p.status === 'VENCIDO') {
                    summary['VENCIDO']++;
                } else {
                    summary['OK']++;
                }
            });

            // Cria os cards de resumo
            const statuses = [
                { title: 'Produtos OK', count: summary['OK'], color: 'bg-green-100', text_color: 'text-green-600' },
                { title: 'A Vencer', count: summary['A VENCER'], color: 'bg-yellow-100', text_color: 'text-yellow-600' },
                { title: 'Vencidos', count: summary['VENCIDO'], color: 'bg-red-100', text_color: 'text-red-600' }
            ];

            statuses.forEach(s => {
                const card = document.createElement('div');
                card.className = `card flex flex-col items-center justify-center ${s.color}`;
                card.innerHTML = `
                    <h3 class="text-xl font-bold mb-2 ${s.text_color}">${s.title}</h3>
                    <p class="text-4xl font-extrabold ${s.text_color}">${s.count}</p>
                `;
                dashboardSummary.appendChild(card);
            });
        }

        // Event listener para o botão de atualização
        document.getElementById('updateDashboardBtn').addEventListener('click', updateDashboard);
        
        // Event listener para o formulário de adição de produto
        document.getElementById('productForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const productName = document.getElementById('productName').value;
            const productType = document.getElementById('productType').value;
            const expirationDate = document.getElementById('expirationDate').value;
            const quantity = document.getElementById('quantity').value;

            // Adiciona o novo produto ao array
            products.push({
                id: nextId++,
                productName: productName,
                productType: productType,
                expirationDate: expirationDate,
                quantity: quantity
            });

            // Limpa o formulário e atualiza o dashboard
            this.reset();
            updateDashboard();
        });

        // Chamada inicial para popular a página
        window.onload = updateDashboard;

    </script>
</body>
</html>
